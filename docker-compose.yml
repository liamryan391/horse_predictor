services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: horse_predictor
      MYSQL_USER: horse_user
      MYSQL_PASSWORD: horse_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://horse_user:horse_password@db:3306/horse_predictor
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      HORSE_API_PROVIDER: sample
      MONITORING_DRIFT_WARNING_THRESHOLD: 0.35
      MONITORING_DRIFT_CRITICAL_THRESHOLD: 0.75
      MONITORING_SLOW_REQUEST_MS: 1000
      MONITORING_MAX_ERROR_RATE: 0.05
      OTEL_ENABLED: false
    command: >
      sh -c "python -m alembic upgrade head
      && python data_pipeline.py --provider sample --no-csv
      && uvicorn api:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql-data:
  frontend-node-modules:
